<nav
  class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top mb-4"
  style="transition: all 0.3s ease;"
>
  <div class="container">
    <a class="navbar-brand d-flex align-items-center">
      <img
        src="assets/panaderia_removebg_preview.png"
        alt="Logo"
        width="70"
        height="70"
        class="d-inline-block align-top"
      />
      <h2 class="ms-2 mb-0 fw-bold text-dark" style="font-size:1.5rem;">
        La Delicia
      </h2>
    </a>

    <button
      class="navbar-toggler border-0"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNavDropdown"
      aria-controls="navbarNavDropdown"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li
          class="nav-item"
          *ngFor="let item of navItems"
        >
          <a
            class="nav-link px-3 py-2"
            [class.active]="item.active"
            [href]="item.link"
            style="transition: background-color 0.3s;"
          >

          </a>
        </li>
      </ul>
    </div>
  </div>
