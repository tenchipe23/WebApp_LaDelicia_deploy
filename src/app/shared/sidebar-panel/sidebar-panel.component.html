<div class="bg-dark text-white sidebar vh-100" style="width: 250px;">
  <div class="sidebar-header p-3 mb-2 border-bottom border-light d-flex align-items-center justify-content-between">
    <h5 class="mb-0">
      <i class="bi bi-grid-fill me-2"></i>Panel de Control
    </h5>
    <button class="btn btn-sm text-white d-lg-none" (click)="onToggle()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <ul class="nav flex-column px-2">
    <li class="nav-item mb-1">
      <a
        class="nav-link text-white d-flex align-items-center"
        routerLink="/control-panel/employees"
        style="transition: background-color 0.3s;"
      >
        <i class="bi bi-people-fill me-2"></i>
        Empleados
      </a>
    </li>
    <li class="nav-item mb-1">
      <a
        class="nav-link text-white d-flex align-items-center"
        routerLink="/control-panel/users"
      >
        <i class="bi bi-person-fill me-2"></i>
        Usuarios
      </a>
    </li>
    <li class="nav-item mb-1">
      <a
        class="nav-link text-white d-flex align-items-center"
        routerLink="/control-panel/product-panel"
      >
        <i class="bi bi-box-seam me-2"></i>
        Productos
      </a>
    </li>
    <li class="nav-item mb-1">
      <a
        class="nav-link text-white d-flex align-items-center"
        routerLink="/control-panel/clients"
      >
        <i class="bi bi-journal-bookmark-fill me-2"></i>
        Clientes
      </a>
    </li>
    <li class="nav-item mb-1">
      <a
        class="nav-link text-white d-flex align-items-center"
        routerLink="/control-panel/cooking-timer"
      >
        <i class="bi bi-hourglass-split me-2"></i>
        Temporizador
      </a>
    </li>
    <li class="nav-item mb-1">
      <a
        class="nav-link text-white d-flex align-items-center"
        routerLink="/dashboard"
      >
        <i class="bi bi-bar-chart-fill me-2"></i>
        Dashboard
      </a>
    </li>
    <li class="nav-item mb-1">
      <a
        class="nav-link text-white d-flex align-items-center"
        (click)="logout()"
      >
        <i class="bi bi-box-arrow-right me-2"></i>
        Cerrar Sesión
      </a>
    </li>
  </ul>
</div>
